
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegación Asturias</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background-color: #0f172a; color: #f8fafc; }
    h1 { font-size: 1.3rem; text-align: center; color: #38bdf8; margin: 12px 0 16px 0; }
    .card { background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; }
    h2 { font-size: 1rem; color: #38bdf8; margin-top: 0; margin-bottom: 10px; }
    iframe { width: 100%; height: 380px; border: none; border-radius: 8px; background: #0f172a; }
    .selector-localidad { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .btn-loc { background-color: #334155; color: #f8fafc; border: 1px solid #475569; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
    .btn-loc.activo { background-color: #0284c7; border-color: #38bdf8; color: #ffffff; }
    .holfuy-box { text-align: center; background: #ffffff; padding: 10px; border-radius: 8px; min-height: 200px; }
    .btn-holfuy-directo { display: inline-block; margin-top: 10px; padding: 10px 16px; background-color: #0284c7; color: #fff; text-decoration: none; font-weight: bold; border-radius: 8px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h1>Navegación Asturias</h1>

  <!-- HOLFUY ESTACIÓN COLINA DEL CUERVO -->
  <div class="card">
    <h2>Viento en Tiempo Real (Holfuy - Colina del Cuervo)</h2>
    <div class="holfuy-box">
      <script type="text/javascript" src="https://holfuy.com/s/widget.php?id=1538&unit=knots&mode=full"></script>
    </div>
    <div style="text-align: center;">
      <a class="btn-holfuy-directo" href="https://holfuy.com/es/weather/1538" target="_blank" rel="noopener">Ver Estación en Holfuy ↗</a>
    </div>
  </div>

  <!-- WINDY CON BOTONES DE ZONA -->
  <div class="card">
    <h2>Previsión Windy (Viento, Rachas y Olas)</h2>
    
    <div class="selector-localidad">
      <button class="btn-loc activo" onclick="cambiarZona(43.550, -5.650, this)">Gijón</button>
      <button class="btn-loc" onclick="cambiarZona(43.615, -5.792, this)">Luanco</button>
      <button class="btn-loc" onclick="cambiarZona(43.537, -7.040, this)">Ribadeo</button>
    </div>

    <iframe id="windy-frame" src="https://embed.windy.com/embed2.html?lat=43.550&lon=-5.650&detailLat=43.550&detailLon=-5.650&width=600&height=450&zoom=11&level=surface&overlay=wind&product=ecmwf&menu=&message=true&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=kt&metricTemp=%C2%B0C&radarRange=-1" title="Windy Mapa"></iframe>
  </div>

  <script>
    function cambiarZona(lat, lon, btn) {
      var iframe = document.getElementById('windy-frame');
      iframe.src = 'https://embed.windy.com/embed2.html?lat=' + lat + '&lon=' + lon + '&detailLat=' + lat + '&detailLon=' + lon + '&width=600&height=450&zoom=11&level=surface&overlay=wind&product=ecmwf&menu=&message=true&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=kt&metricTemp=%C2%B0C&radarRange=-1';
      
      var botones = document.querySelectorAll('.btn-loc');
      botones.forEach(function(b) { b.classList.remove('activo'); });
      btn.classList.add('activo');
    }
  </script>

</body>
</html>
